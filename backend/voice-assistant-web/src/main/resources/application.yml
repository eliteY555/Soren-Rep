server:
  port: 8080

spring:
  application:
    name: voice-assistant
  datasource:
    url: jdbc:mysql://localhost:3306/voice_assistant?useUnicode=true&characterEncoding=utf-8&createDatabaseIfNotExist=true
    username: root
    password: ${MYSQL_PASSWORD:2003}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    mongodb:
      uri: mongodb://localhost:27017/voice_assistant
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# --- Pinecone Vector Database ---
pinecone:
  api-key: ${PINECONE_API_KEY:your-pinecone-api-key}
  index: ${PINECONE_INDEX:job-assistant}

# --- Embedding Model (Qwen DashScope, OpenAI-compatible endpoint) ---
embedding:
  api-key: ${QWEN_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model-name: text-embedding-v3

# --- Initial LLM Provider (seeded on first startup) ---
initial-provider:
  name: DeepSeek V4 Pro
  provider: deepseek
  base-url: https://api.deepseek.com
  model-name: deepseek-v4-pro
  api-key: ${DEEPSEEK_KEY}

logging:
  level:
    com.voiceassistant: DEBUG
    dev.langchain4j: DEBUG
